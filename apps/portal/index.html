<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e11" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("netbite-portal-theme");
          const preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          const resolved = preference === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.theme = resolved;
          document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#100e11" : "#f6f3f5";
        } catch {}
      })();
    </script>
    <title>NetBite Instructor Console</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
